<footer>
  <div style="text-align: center;">
    <img
      class="footer"
      id="runner"
      src="/assets/site/4runner.png"
      alt="Toyota 4Runner, white with black trim"
      width="780"
      height="562"
      loading="lazy"
      decoding="async"
      onclick="revTheEngine()">

    <p class="footer-dedication">RIP My 2000 Toyota 4runner</p>
    <p class="footer-dedication-sub">you were the <i>hottest</i> salvage on these sunny roads</p>
  </div>
</footer>

<script>
const soundPaths = [
  '/assets/sounds/Unlocking 4runner.mp3',
  '/assets/sounds/02 Engine Start 4runner.mp3'
];

function revTheEngine() {
  const src = soundPaths[Math.floor(Math.random() * soundPaths.length)];
  const audio = new Audio(src);
  audio.play();

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const car = document.getElementById('runner');
    if (!car) return;

    car.classList.add('footer-shake');
    setTimeout(() => car.classList.remove('footer-shake'), 500);
  }
}
</script>
