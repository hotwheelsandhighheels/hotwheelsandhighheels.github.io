<footer>
  <div style="text-align: center;">
    <img
      src="/assets/site/4runner.png"
      alt="Toyota 4Runner, white with black trim"
      class="footer"
      id="runner"
      onclick="revTheEngine()">

    <p class="footer-dedication">RIP My 2000 Toyota 4runner</p>
    <p class="footer-dedication-sub">you were the <b><b></b>hottest</b></i> salvage on these sunny roads</p>
  </div>
</footer>

<script>
// Preload 4Runner sounds so they're ready to play instantly.
// Creating the Audio objects once and loading them upfront
// eliminates the network fetch delay on first click.
const sounds = [
  new Audio('/assets/sounds/Unlocking 4runner.mp3'),
  new Audio('/assets/sounds/02 Engine Start 4runner.mp3')
];

// Tell the browser to load the audio files before they're needed
sounds.forEach(audio => {
  audio.preload = 'auto';
  audio.load();
});

function revTheEngine() {
  // Pick a random sound
  const audio = sounds[Math.floor(Math.random() * sounds.length)];
  
  // Reset to beginning if it was played before
  audio.currentTime = 0;
  audio.play();

  // Shake the car — only if user hasn't requested reduced motion
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const car = document.getElementById('runner');
    car.classList.add('footer-shake');
    setTimeout(() => car.classList.remove('footer-shake'), 500);
  }
}
</script>
