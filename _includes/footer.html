<!-- footer.html — included in default.html ONLY, not in post.html -->
<!-- Posts don't have a footer — they use padding-bottom on body.post .container instead -->
<!-- .footer class in CSS caps the image height at 70pt -->
<!-- inline style="text-align: center" centers everything inside the footer -->
<!-- <i> tag makes text italic — same as _ in markdown -->
<footer>
  <div style="text-align: center;">
    <img class="footer" src="/assets/Images/4runner.jpg" alt="Toyota 4Runner, White with black trim">
    <p>RIP My 2000 Toyota 4runner <br>
    you were the <i>hottest</i> salvage on these sunny roads</p>
  </div>
</footer>
