<!-- head.html — included in EVERY layout via {% include head.html %} -->
<!-- The <head> is invisible to users — it contains metadata the browser and search engines read -->
<head>

    <!-- tells the browser to use UTF-8 character encoding — supports all languages and special characters -->
    <meta charset="UTF-8">

    <!-- makes the page responsive — without this mobile browsers zoom out and show a tiny desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- sets the browser tab title — {{ page.title }} pulls from the 'title:' in each page's front matter -->
    <!-- if no title is set in front matter it falls back to the site title in _config.yml -->
    <title>{{ page.title }}</title>

    <!-- links the CSS file — this one stylesheet applies to every page on the site -->
    <!-- /assets/css/styles.css is the path from the site root -->
    <link rel="stylesheet" href="/assets/css/styles.css">

    <!-- generated by jekyll-feed plugin — adds RSS feed metadata so readers can subscribe via RSS -->
    {% feed_meta %}

    <!-- generated by jekyll-seo-tag plugin — automatically builds all meta description, -->
    <!-- og:title, og:description, twitter:card tags from _config.yml and page front matter -->
    {% seo %}

</head>
