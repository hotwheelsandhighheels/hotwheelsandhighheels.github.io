<!doctype html>
<html lang="en-US">
{% include head.html %}

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container">
    {% include header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
    </div>
    <button onclick="window.scrollTo({top:0, behavior: 'smooth'})" class="back-to-top" aria-label="back-to-top">&#8593;</button>
    <!-- light/dark mode toggle — bottom left corner, mirrors back-to-top button on right -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark mode">☼</button>
<script>
  // toggleTheme() flips between dark (default) and light mode.
  // The actual theme detection happens in head.html before page render.
  // This script only handles the button click and icon update.
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.theme-toggle');
    if (html.getAttribute('data-theme') === 'light') {
      html.removeAttribute('data-theme');
      btn.textContent = '☼';
      localStorage.removeItem('theme');
    } else {
      html.setAttribute('data-theme', 'light');
      btn.textContent = '☽';
      localStorage.setItem('theme', 'light');
    }
  }

  // Update the toggle button icon on page load if a saved theme exists.
  // The theme itself was already applied by the script in head.html,
  // so we don't need to set data-theme again — just fix the icon.
  (function() {
    if (localStorage.getItem('theme') === 'light') {
      document.querySelector('.theme-toggle').textContent = '☽';
    }
  })();
</script>
  </body>
</html>
