<script>
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.theme-toggle');
    if (html.getAttribute('data-theme') === 'light') {
      html.removeAttribute('data-theme');
      btn.textContent = '☼';
      localStorage.removeItem('theme');
    } else {
      html.setAttribute('data-theme', 'light');
      btn.textContent = '☽';
      localStorage.setItem('theme', 'light');
    }
  }

  (function() {
    if (localStorage.getItem('theme') === 'light') {
      document.querySelector('.theme-toggle').textContent = '☽';
    }
  })();

  function selectAllText(element) {
    var range = document.createRange();
    var selection = window.getSelection();
    range.selectNodeContents(element);
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function openBlessingLightbox(src) {
    document.getElementById('blessing-lightbox-img').src = src;
    document.getElementById('blessing-lightbox').classList.add('open');
  }

  function closeBlessingLightbox() {
    document.getElementById('blessing-lightbox').classList.remove('open');
  }

  function toggleInterests(el) {
    var container = el.closest('.bio-text').querySelector('.myspace-interests');
    if (container) {
      container.classList.toggle('open');
    }
  }

  function openLightbox() {
    const lightbox = document.getElementById('lightbox');
    if (lightbox) lightbox.classList.add('open');
  }

  function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    if (lightbox) lightbox.classList.remove('open');
  }
</script>
