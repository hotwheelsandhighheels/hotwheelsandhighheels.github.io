    <!-- light/dark mode toggle — bottom left corner, mirrors back-to-top button on right -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark mode">☼</button>
      <script>
  // toggleTheme() runs when the button is clicked
  // it flips between dark (default) and light mode
  // localStorage saves the choice so it persists across pages
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.theme-toggle');
    if (html.getAttribute('data-theme') === 'light') {
      html.removeAttribute('data-theme');
      btn.textContent = '☼';
      localStorage.removeItem('theme'); // forgets the saved preference
    } else {
      html.setAttribute('data-theme', 'light');
      btn.textContent = '☾';
      localStorage.setItem('theme', 'light'); // saves 'light' to the browser
    }
  }

  // runs immediately on every page load before anything renders
  // checks if a theme preference was saved and applies it right away
  const saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.querySelector('.theme-toggle').textContent = '☾';
  }
  </script>
